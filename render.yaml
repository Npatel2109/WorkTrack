services:
  - type: web
    name: worktrack
    runtime: python
    plan: free
    region: singapore
    branch: main
    buildCommand: pip install -r requirements.txt
    # Free instances do not support preDeployCommand, so migrations run at startup.
    startCommand: >-
      flask --app wsgi db upgrade &&
      flask --app wsgi ensure-admin &&
      gunicorn --workers 2 --timeout 120 --bind 0.0.0.0:$PORT wsgi:app
    healthCheckPath: /login
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: worktrack-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: TRUST_PROXY
        value: "1"
      - key: COOKIE_SECURE
        value: "1"
      - key: SESSION_TIMEOUT_MINUTES
        value: "60"
      - key: MAX_CONTENT_LENGTH
        value: "8388608"
      - key: PUBLIC_BASE_URL
        sync: false
      - key: ADMIN_NAME
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_MOBILE
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: MAIL_SERVER
        sync: false
      - key: MAIL_PORT
        value: "587"
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_USE_TLS
        value: "1"
      - key: MAIL_DEFAULT_SENDER
        sync: false

databases:
  - name: worktrack-db
    plan: free
    region: singapore
    databaseName: worktrack
