{% extends "base.html" %}
{% block title %}Forgot password{% endblock %}
{% block content %}
<div class="login-shell"><section class="login-card shadow-lg">
  <div class="text-center mb-4"><div class="login-symbol">G</div><p class="eyebrow">ACCOUNT RECOVERY</p><h1 class="h3 fw-bold">Reset your password</h1><p class="text-secondary">Enter your account email. If it matches an active account, we'll send a secure reset link.</p></div>
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label class="form-label" for="email">Email address</label>
    <input class="form-control form-control-lg mb-3" id="email" type="email" name="email" autocomplete="email" required>
    <button class="btn btn-primary btn-lg w-100" type="submit">Send reset link</button>
  </form>
  <div class="text-center mt-3"><a href="{{ url_for('main.login') }}">Back to sign in</a></div>
</section></div>
{% endblock %}
