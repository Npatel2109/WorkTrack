{% extends "base.html" %}
{% block title %}Choose a new password{% endblock %}
{% block content %}
<div class="login-shell"><section class="login-card shadow-lg">
  <div class="text-center mb-4"><div class="login-symbol">G</div><p class="eyebrow">ACCOUNT RECOVERY</p><h1 class="h3 fw-bold">Choose a new password</h1><p class="text-secondary">Use at least 12 characters. This link expires after one hour.</p></div>
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label class="form-label" for="password">New password</label>
    <input class="form-control form-control-lg mb-3" id="password" type="password" name="password" minlength="12" autocomplete="new-password" required>
    <label class="form-label" for="confirm-password">Confirm new password</label>
    <input class="form-control form-control-lg mb-4" id="confirm-password" type="password" name="confirm_password" minlength="12" autocomplete="new-password" required>
    <button class="btn btn-primary btn-lg w-100" type="submit">Save new password</button>
  </form>
</section></div>
{% endblock %}
